<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mossvale · The artisan's path</title>
</head>
<body class="professions-preview">
  <!-- Extend Mossvale's woodland palette and parchment journal. The models lead;
       the journal shows the actual profession rules. Local sample data only. -->
  <header class="preview-heading">
    <div><h1>The artisan’s path</h1><p>Mossvale · Local art and progression preview</p></div>
    <label>Model collection <select id="collection"><option value="woodcutting">Woodcutting</option><option value="mining">Mining</option><option value="herbalism">Herbalism</option><option value="workshops">Workshops</option></select></label>
    <button id="regrowth" aria-pressed="false">Show harvested</button>
    <button id="reset-view">Reset view</button>
  </header>
  <main class="preview-layout">
    <section id="viewport" aria-label="Interactive Blender models">
      <canvas id="preview" tabindex="0" aria-label="Models. Drag to orbit and scroll to zoom."></canvas>
      <div id="model-labels"></div>
      <div class="preview-caption"><h2 id="collection-title">Woodcutting</h2><p id="model-description">Loading authored models…</p><p id="render-status" role="status">Loading gathering kit…</p><small>Drag to orbit · Scroll to inspect · Select a label for a close view</small></div>
    </section>
    <section class="panel preview-journal" aria-label="Profession journal">
      <div class="preview-journal-heading"><h2>Your next craft</h2><label>Sample profession level <select id="sample-level"><option value="1">1 · Apprentice</option><option value="10">10 · Journeyman</option><option value="25">25 · Expert</option><option value="50">50 · Artisan</option><option value="99">99 · Mastered</option></select></label></div>
      <nav class="skill-tabs" aria-label="Preview journal"><button class="primary-button" data-page="gathering" aria-pressed="true">Gathering</button><button class="primary-button" data-page="crafting" aria-pressed="false">Crafting</button></nav>
      <p class="preview-sample">Sample level 60 adventurer. This preview does not change a saved character.</p>
      <p id="preview-notice" role="status"></p>
      <div id="panel-content"></div>
    </section>
  </main>
  <script type="module" src="/src/professions-preview.ts"></script>
</body>
</html>
