<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#202d28"/>
  <meta name="description" content="Find your own adventure in Mossvale, a living voxel world. Explore, gather, battle, and play together."/>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png"/>
  <title>Mossvale — A little world. A grand adventure.</title>
  <style>
    #boot-loading{position:fixed;inset:0;z-index:99;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:32px 20px;background:#092b20;color:#f8f3de;text-align:center;font-family:system-ui,sans-serif}
    #boot-loading img{width:min(420px,70vw);height:auto;max-height:35dvh;object-fit:contain;margin-bottom:26px}
    #boot-loading h1{font:clamp(20px,4vw,30px) Georgia,serif;margin:0}
    #boot-loading p{font-size:14px;color:#d8dfc0}
  </style>
</head>
<body>
  <div id="app">
    <div id="boot-loading" role="status">
      <img src="/ui/wordmark.png" alt="Mossvale"/>
      <h1>Your adventure is taking shape</h1>
      <p>Preparing the realm…</p>
      <noscript><p>Enable JavaScript to play Mossvale.</p></noscript>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
