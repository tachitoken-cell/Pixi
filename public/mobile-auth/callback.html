<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="referrer" content="no-referrer"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#091310"/>
<title>Return to Mossvale</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#091310;color:#ead9b2;font:17px/1.6 system-ui,sans-serif;text-align:center}main{max-width:420px}h1{font-size:30px;line-height:1.25}p{color:#c3cec3}a,button{display:block;width:100%;margin:24px 0;padding:14px 24px;background:#c8ad73;color:#091310;border:0;border-radius:12px;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:5px}[hidden]{display:none}
</style>
</head>
<body><main>
<h1>Return to Mossvale</h1>
<p id="status" role="status">This sign-in link is missing or expired. Return to the Mossvale app and start again.</p>
<a id="return" hidden>Open Mossvale</a>
<button id="retry" type="button" hidden>Try again</button>
<p id="help" hidden>If the wallet keeps this page open, switch back to the Mossvale app to finish.</p>
<noscript>Enable JavaScript in your wallet browser to return to Mossvale.</noscript>
</main>
<script>
(() => {
  const url = new URL(location.href), params = new URLSearchParams(url.hash.slice(1));
  const hosts = ['mossvale.world', 'us.mossvale.world', 'asia.mossvale.world'];
  if (url.protocol === 'https:' && hosts.includes(url.host) && url.pathname === '/mobile-auth/callback' && !url.search && !url.username && !url.password
      && [...params.keys()].length === 1 && /^[a-f0-9]{64}$/.test(params.get('walletAction') || '')) {
    const target = new URL(`https://${hosts.find(host => host !== url.host)}/mobile-auth/callback`); target.hash = params.toString();
    const link = document.getElementById('return'); link.href = target.href; link.hidden = false;
    document.getElementById('status').textContent = 'Your wallet action is finished. Return to the Mossvale app to check its result.';
    document.getElementById('help').hidden = false;
    history.replaceState(history.state, '', url.origin + url.pathname);
    return; // This is only an app wake-up link; the result stays behind the native retrieval secret.
  }
  const allowed = new Set(['code', 'state', 'session_state', 'iss', 'kc_action_status', 'kc_action', 'error', 'error_description', 'error_uri']);
  if (url.protocol !== 'https:' || !hosts.includes(url.host) || url.pathname !== '/mobile-auth/callback' || url.search || url.username || url.password || url.href.length > 8192 ||
      [...params.keys()].some(key => !allowed.has(key) || params.getAll(key).length !== 1) || !/^[A-Za-z0-9_-]{20,256}$/.test(params.get('state') || '') ||
      (!!params.get('code') === !!params.get('error')) || params.get('iss') !== 'https://auth.mossvale.world/realms/mossvale') return;
  params.delete('error_description'); params.delete('error_uri');
  // A same-window tap to the other associated host lets iOS open the installed app.
  const target = new URL(`https://${hosts.find(host => host !== url.host)}/mobile-auth/callback`);
  target.hash = params.toString();
  const link = document.getElementById('return'); link.href = target.href;
  const callback = new URL('https://mossvale.world/mobile-auth/callback'); callback.hash = params.toString();
  const status = document.getElementById('status'), retry = document.getElementById('retry');
  async function complete() {
    retry.hidden = true; status.textContent = 'Finishing sign-in…';
    try {
      const response = await fetch('https://mossvale.world/wallet-oidc/mobile/complete', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'omit', cache: 'no-store', keepalive: true,
        body: JSON.stringify({callback: callback.href}), signal: AbortSignal.timeout(10000),
      });
      if (!response.ok) throw Error();
      status.textContent = params.has('error') ? 'Sign-in was cancelled. Return to Mossvale to try again.' : 'Your wallet approved sign-in. Return to Mossvale to finish.';
      link.hidden = false; document.getElementById('help').hidden = false;
      // The app can now recover its one-use response even when the wallet blocks app links.
      history.replaceState(history.state, '', url.origin + url.pathname);
    } catch {
      status.textContent = 'Could not finish sign-in. Check your connection and try again.'; retry.hidden = false;
    }
  }
  retry.onclick = () => { void complete(); };
  void complete();
})();
</script>
</body>
</html>
