<!doctype html>
<html lang="en" data-realm-restarting>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Mossvale · Reconnecting</title>
<style>
  :root{color-scheme:dark;font-family:Georgia,'Times New Roman',serif;color:#f1e5c7;background:#17251f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 35%,#304638 0,transparent 65%)}
  main{max-width:440px;text-align:center}
  .lantern{width:68px;height:88px;color:#edc16d;margin-bottom:20px}
  .brand{margin:0 0 44px;font-size:17px;letter-spacing:.22em;color:#dbc796}
  h1{font-size:clamp(30px,7vw,40px);font-weight:400;line-height:1.15;margin:0 0 20px}
  p{font:16px/1.65 system-ui,sans-serif;margin:0 0 22px;color:#c7cfbf}
  #restart-status{font-size:13px;color:#b8c5b6;min-height:22px;margin:30px 0 16px}
  button{font:600 15px/1.3 system-ui,sans-serif;min-height:46px;padding:12px 26px;border:1px solid #d6b574;border-radius:5px;background:#e8ce94;color:#26392b;cursor:pointer}
  button:hover{background:#f2dda9}button:focus-visible{outline:2px solid #f4e3b5;outline-offset:5px}button:disabled{cursor:wait;opacity:.7}
  noscript p{margin-top:20px;font-size:13px}
</style>
<main>
  <svg class="lantern" viewBox="0 0 68 88" fill="none" aria-hidden="true"><path d="M26 18V11a8 8 0 0 1 16 0v7M19 24h30l-5-7H24l-5 7Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M19 29h30l-4 37H23l-4-37Z" fill="#edc16d" fill-opacity=".1" stroke="currentColor" stroke-width="3"/><path d="M34 35v23M19 72h30M24 79h20" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="m34 38 6 10-6 10-6-10 6-10Z" fill="currentColor"/></svg>
  <div class="brand">MOSSVALE</div>
  <h1>Back in a moment</h1>
  <p>The realm is coming back online.<br>We’ll reconnect you automatically when it’s ready.</p>
  <p id="restart-status" role="status" aria-live="polite">Waiting for the realm…</p>
  <button id="restart-retry" type="button">Try again</button>
  <noscript><p>Reload this page in a moment to return to Mossvale.</p></noscript>
</main>
<script>
(() => {
  const status = document.getElementById('restart-status');
  const retry = document.getElementById('restart-retry');
  let checking = false, timer;
  async function check() {
    if (checking) return;
    clearTimeout(timer); checking = true; retry.disabled = true;
    status.textContent = 'Checking the realm…';
    try {
      const health = await fetch('/api/health', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
      if (health.ok) {
        const state = await health.json();
        if (state.ok === true && state.available === true) {
          const page = await fetch('/', { cache: 'no-store', headers: { Accept: 'text/html' }, signal: AbortSignal.timeout(5000) });
          const html = page.ok ? await page.text() : '';
          if (html.includes('<div id="app">') && !html.includes('data-realm-restarting')) {
            status.textContent = 'The realm is ready. Reconnecting…';
            location.reload(); return;
          }
        }
      }
    } catch { /* The next check also recovers from a lost connection. */ }
    checking = false; retry.disabled = false;
    status.textContent = 'Still reconnecting. We’ll check again shortly.';
    timer = setTimeout(check, 5000);
  }
  retry.addEventListener('click', check);
  timer = setTimeout(check, 5000);
})();
</script>
</html>
