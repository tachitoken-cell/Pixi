<!doctype html>
<html lang="en">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mossvale · Spell atelier</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17241f;color:#f3eddb;font:14px/1.45 system-ui,sans-serif}main{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header,footer{padding:14px 24px;background:#17231feb;border-color:#4a5848}header{display:flex;align-items:center;gap:24px;border-bottom:1px solid #4a5848}h1{font-size:22px;font-weight:550;margin:0;letter-spacing:-.03em}small{font-size:10px;color:#c5b985;letter-spacing:.18em}#selection{display:flex;gap:7px;align-items:center;flex:1;max-width:590px}select,button{font:inherit;color:inherit;background:#25382f;border:1px solid #63715b;border-radius:4px;padding:8px 12px}select{min-width:0;width:100%}button{cursor:pointer;white-space:nowrap}button:hover{background:#354b3f}button:disabled,select:disabled{opacity:.5;cursor:wait}button:focus-visible,select:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid #e3c87f;outline-offset:3px}#quality{width:auto;margin-left:auto}#viewport{position:relative;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#caption{position:absolute;left:24px;top:20px;max-width:420px;pointer-events:none;text-shadow:0 2px 5px #112019}#name{font-size:29px;line-height:1.1;margin:5px 0 8px;font-weight:500;letter-spacing:-.025em}#description{margin:0;color:#c1ceba;font-size:13px}#status{position:absolute;right:24px;bottom:18px;font-size:12px;color:#d5ddc9;font-variant-numeric:tabular-nums;pointer-events:none}footer{border-top:1px solid #4a5848;display:flex;align-items:center;gap:14px}#timeline{flex:1;min-width:50px;accent-color:#d9c486}output{width:95px;font-variant-numeric:tabular-nums;color:#e6d498}#hint{color:#96ab99;font-size:11px;white-space:nowrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:700px){header,footer{padding:10px 12px;gap:8px}header{flex-wrap:wrap}header>div:first-child{display:flex;gap:10px;align-items:center}h1{font-size:18px}#selection{order:3;flex-basis:100%;max-width:none}#quality{font-size:12px}#caption{left:14px;top:14px;max-width:280px}#name{font-size:24px}#description{font-size:11px}#status{right:12px;bottom:12px;font-size:10px}#hint{display:none}button{padding:8px 10px}output{width:84px;font-size:12px}}
</style>
<main>
<header><div><small>MOSSVALE</small><h1>Spell atelier</h1></div><div id="selection"><button id="previous" aria-label="Previous spell" disabled>←</button><label for="spell" class="sr">Spell</label><select id="spell" disabled></select><button id="next" aria-label="Next spell" disabled>→</button></div><label for="quality" class="sr">Effect detail</label><select id="quality"><option value="high">High detail</option><option value="low">Low detail</option><option value="off">Essential cues</option></select></header>
<section id="viewport"><canvas id="preview" tabindex="0" aria-label="Interactive spell animation preview; drag to orbit and scroll to zoom"></canvas><div id="caption"><small id="calling">LOCAL ANIMATION STUDY</small><h2 id="name">Preparing the spellbook</h2><p id="description">Loading the game’s characters, targets and Blender effects.</p></div><div id="status" role="status">Loading…</div></section>
<footer><button id="replay" disabled>Replay</button><button id="pause" aria-pressed="false" disabled>Pause</button><label for="timeline" class="sr">Seconds after cast release</label><input id="timeline" type="range" min="0" max="3" step="0.001" value="0" disabled><output id="clock" for="timeline">0.00 / 3.00 s</output><span id="hint">Drag to orbit · Scroll to zoom</span></footer>
</main>
<script type="module" src="/src/spell-preview.ts"></script>
</html>
