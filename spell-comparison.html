<!doctype html>
<html lang="en">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mossvale · Spell comparison</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17231d;color:#f1ecd9;font:14px/1.4 system-ui,sans-serif}main{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}header,footer{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#17231d}h1{font-size:19px;font-weight:550;margin:0 12px 0 0;letter-spacing:-.02em}small{font-size:10px;letter-spacing:.15em;color:#bdb184}select,button{font:inherit;color:inherit;background:#293c30;border:1px solid #64705a;border-radius:4px;padding:7px 11px}button{cursor:pointer}button:hover{background:#38503e}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #dec57e;outline-offset:3px}#page{margin-left:auto;color:#bcc9b4;white-space:nowrap}#stage{min-height:0;position:relative}canvas{position:absolute;inset:0;display:block;width:100%;height:100%}#cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.cell{position:relative;min-width:0;border:1px solid #425346;pointer-events:none}.cell>a{position:absolute;left:14px;top:10px;text-decoration:none;color:#eee8d6;pointer-events:auto;font-size:16px;line-height:1.3;text-shadow:0 1px 3px #16241b}.cell>a:hover{color:#f7d481}.cell small{display:block;font-size:9px;margin-top:3px}.cell output{position:absolute;bottom:10px;left:14px;font-size:10px;color:#95aa94;font-variant-numeric:tabular-nums}.cell[hidden]{display:none}#progress{accent-color:#dac383;flex:1;min-width:50px}#percent{min-width:38px;font-variant-numeric:tabular-nums;color:#e0cb90}#status{color:#a8b79f;font-size:11px;min-width:155px;text-align:right}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:760px){header,footer{gap:7px;padding:9px}header{flex-wrap:wrap}h1{font-size:16px;margin-right:auto}header>small{display:none}#page{font-size:11px;margin-left:0}#cells{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}.cell>a{left:9px;top:8px;font-size:12px}.cell small{font-size:8px}.cell output{left:9px;bottom:6px;font-size:9px}#status{min-width:0;font-size:9px;max-width:100px}select,button{font-size:12px;padding:6px 8px}}
</style>
<main><header><small>MOSSVALE</small><h1>Spell comparison</h1><label class="sr" for="class">Calling</label><select id="class"><option>Ranger</option><option>Knight</option><option selected>Mage</option><option>Cleric</option></select><button id="previous" disabled>← Previous</button><button id="next" disabled>Next →</button><span id="page"></span></header>
<section id="stage" aria-label="Six spell animations compared at the same phase"><canvas id="comparison" aria-label="Spell comparison view"></canvas><div id="cells"></div></section>
<footer><label class="sr" for="phase">Animation phase</label><select id="phase"><option value="flight">Flight / release</option><option value="impact">Impact</option></select><button id="pause" aria-pressed="true" disabled>Play</button><label class="sr" for="progress">Phase progress</label><input id="progress" type="range" min="0" max="1" step="0.001" value="0.5"><output id="percent" for="progress">50%</output><span id="status" role="status">Loading Blender effects…</span></footer></main>
<script type="module" src="/src/spell-comparison.ts"></script>
</html>
