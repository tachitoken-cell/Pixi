name: Build and deploy Mossvale auth

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the image to production after building
        type: boolean
        default: false
      existing_image:
        description: Optional published digest to deploy or roll back (skip build)
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: mossvale-auth-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'trappyon/mossvale' && github.event.repository.private
    runs-on: [self-hosted, linux, x64, mossvale-ci]
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check deployment failure and recovery paths
        run: node scripts/check-auth-deploy.mjs

      - name: Set up Buildx
        if: inputs.existing_image == ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GHCR
        if: inputs.existing_image == ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the auth image
        id: image
        if: inputs.existing_image == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.auth
          platforms: linux/amd64
          push: true
          tags: ghcr.io/trappyon/mossvale-auth:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Mossvale authentication
            org.opencontainers.image.description=Keycloak with the Mossvale login theme; no account data
            org.opencontainers.image.source=https://github.com/trappyon/mossvale
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Record the immutable deployment reference
        env:
          AUTH_IMAGE: ${{ inputs.existing_image || format('ghcr.io/trappyon/mossvale-auth@{0}', steps.image.outputs.digest) }}
        run: |
          node -e 'if (!/^ghcr.io\/trappyon\/mossvale-auth@sha256:[a-f0-9]{64}$/.test(process.env.AUTH_IMAGE)) process.exit(1)'
          printf 'Image: `%s`\n' "$AUTH_IMAGE" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    if: inputs.deploy
    runs-on: [self-hosted, linux, x64, mossvale-ci]
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: mossvale-auth-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Release the immutable image through BBA
        env:
          BBA_API_TOKEN: ${{ secrets.BBA_API_TOKEN }}
          AUTH_IMAGE: ${{ inputs.existing_image || format('ghcr.io/trappyon/mossvale-auth@{0}', needs.image.outputs.digest) }}
        run: node scripts/deploy-auth.mjs "$AUTH_IMAGE"
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-release-${{ github.run_id }}
          path: artifacts/auth-release.json
          if-no-files-found: ignore
          retention-days: 30
