name: Mossvale production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      activate_gold_economy:
        description: 'Activate the one-time gold reset after a verified compatibility release (fresh main revision required)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mossvale-production-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  activation-preflight:
    if: github.repository == 'trappyon/mossvale' && github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, mossvale-ci]
    timeout-minutes: 5
    environment: production
    steps:
      # Environment-scoped variables are available after entering this job.
      - name: Read Turnkey activation gate
        id: gate
        env:
          ACTIVATE_TURNKEY: ${{ vars.MOSSVALE_ACTIVATE_TURNKEY }}
        run: |
          case "$ACTIVATE_TURNKEY" in
            ''|false) echo 'enabled=false' >> "$GITHUB_OUTPUT" ;;
            true) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
            *) echo '::error::Invalid Turnkey activation gate'; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci --omit=dev
        if: steps.gate.outputs.enabled == 'true'
      - name: Check activation readiness before CI
        if: steps.gate.outputs.enabled == 'true'
        env:
          MOSSVALE_ACTIVATE_TURNKEY: ${{ vars.MOSSVALE_ACTIVATE_TURNKEY }}
          MOSSVALE_DEPLOY_TOKEN: ${{ secrets.MOSSVALE_DEPLOY_TOKEN }}
          MOSSVALE_EU_BBA_APP_ID: ${{ vars.MOSSVALE_EU_BBA_APP_ID }}
          BBA_API_TOKEN: ${{ secrets.MOSSVALE_BBA_API_TOKEN || secrets.BBA_API_TOKEN }}
          TURNKEY_ORGANIZATION_ID: ${{ vars.TURNKEY_ORGANIZATION_ID }}
          TURNKEY_AUTH_PROXY_CONFIG_ID: ${{ vars.TURNKEY_AUTH_PROXY_CONFIG_ID }}
          ALCHEMY_WALLET_API_KEY: ${{ secrets.ALCHEMY_WALLET_API_KEY }}
          ALCHEMY_GAS_POLICY_ID: ${{ vars.ALCHEMY_GAS_POLICY_ID }}
          TURNKEY_SPONSOR_MAX_OPERATION_WEI: ${{ vars.TURNKEY_SPONSOR_MAX_OPERATION_WEI }}
          TURNKEY_SPONSOR_ACCOUNT_DAILY_WEI: ${{ vars.TURNKEY_SPONSOR_ACCOUNT_DAILY_WEI }}
          TURNKEY_SPONSOR_WALLET_DAILY_WEI: ${{ vars.TURNKEY_SPONSOR_WALLET_DAILY_WEI }}
          TURNKEY_SPONSOR_GLOBAL_DAILY_WEI: ${{ vars.TURNKEY_SPONSOR_GLOBAL_DAILY_WEI }}
          TURNKEY_SPONSOR_MAX_FEE_PER_GAS_WEI: ${{ vars.TURNKEY_SPONSOR_MAX_FEE_PER_GAS_WEI }}
          TURNKEY_SPONSOR_GLOBAL_DAILY_OPERATIONS: ${{ vars.TURNKEY_SPONSOR_GLOBAL_DAILY_OPERATIONS }}
        run: node scripts/turnkey-activation-readiness.mjs

  check-shards:
    name: Check batch ${{ matrix.batch }}
    needs: activation-preflight
    if: >-
      !cancelled() && (needs.activation-preflight.result == 'success' || (github.ref != 'refs/heads/main' && needs.activation-preflight.result == 'skipped')) &&
      github.repository == 'trappyon/mossvale' && github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, mossvale-ci]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # The last full run spent 838s/840s in these suites. Reuse setup within each worker.
        include:
          - batch: 1
            suites: [combat-feedback, dungeon-chambers, towns-auctions, economy-updates, arena-performance, characters-treasury]
          - batch: 2
            suites: [shared-progress, nft-wallet, store-release, client-mobile, gm-controls]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only patch-note validation compares commits and needs their history.
          fetch-depth: ${{ contains(matrix.suites, 'store-release') && '0' || '1' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
        id: build
      - name: Run shared-progress checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'shared-progress') }}
        timeout-minutes: 15
        run: |
          npm run check:hosting-realms
          npm run check:world-atlas
          npm run check:raid
          git diff --exit-code
      - name: Run combat-feedback checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'combat-feedback') }}
        timeout-minutes: 15
        run: |
          npm run check:feedback
          npm run check:class-redesign
          node scripts/check-knight-rework-server.mjs
          node scripts/check-ranged-auto-release-server.mjs
          node scripts/check-reworked-spells-server.mjs
          node scripts/check-dungeon-mechanics.mjs
          node scripts/check-dungeon-reentry.mjs
          npm run check:stats
          git diff --exit-code
      - name: Run dungeon-chambers checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'dungeon-chambers') }}
        timeout-minutes: 15
        run: |
          npm run check:dungeon-art
          npm run check:dungeon-results
          npm run check:instant-combat
          node scripts/check-dungeon-room-client.mjs
          node scripts/check-dungeon-room-visibility.mjs
          node scripts/check-dungeon-room-portals.mjs
          node scripts/check-dungeon-traps.mjs
          node scripts/check-dungeon-boss-models.mjs
          node scripts/check-dungeon-layouts.mjs
          node scripts/check-dungeon-gates.mjs
          node scripts/check-dungeon-pursuit.mjs
          git diff --exit-code
      - name: Run nft-wallet checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'nft-wallet') }}
        timeout-minutes: 15
        run: |
          npm run check:pets
          npm run check:nfts
          npm run check:specialists
          npm run check:native-vouchers
          npm run check:turnkey
          npm run check:gold-rounds
          git diff --exit-code
      - name: Run store-release checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'store-release') }}
        timeout-minutes: 15
        run: |
          npm run check:store
          npm run check:wiki
          node wiki/check-sync.mjs --self-check
          npm run check:deployment
          node scripts/check-turnkey-activation-readiness.mjs
          node scripts/check-ci-workflow.mjs
          git diff --exit-code
      - name: Run towns-auctions checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'towns-auctions') }}
        timeout-minutes: 15
        run: |
          node scripts/check-world-generation.mjs
          node scripts/check-town-biomes.mjs
          node scripts/check-trainer-placement.mjs
          node scripts/check-merchants.mjs
          node scripts/check-shop-ui.mjs
          npm run check:training-dummies
          npm run check:hearthling
          npm run check:story-quests
          npm run check:polls
          node scripts/check-gold-merchant-world.mjs
          node scripts/check-gold-merchant-holdings.mjs
          node scripts/check-gold-merchant-ui.mjs
          npm run check:wallet-picker
          node scripts/check-auction-chain.mjs
          node scripts/check-auction-token-chain.mjs
          node scripts/check-auction-deploy.mjs
          node scripts/check-auction-crypto-server.mjs --migration
          npm run check:referrals
          git diff --exit-code
      - name: Run economy-updates checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'economy-updates') }}
        timeout-minutes: 15
        run: |
          npm run check:guards
          npm run check:gold
          npm run check:updates
          npm --prefix mobile ci
          npm --prefix mobile run check
          git diff --exit-code
      - name: Run client-mobile checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'client-mobile') }}
        timeout-minutes: 15
        run: |
          npm run check:mobile-purchases
          node scripts/check-push-notifications.mjs
          node scripts/check-push-notification-http.mjs
          npm run check:app-updates
          npm run check:mobile
          node scripts/check-client-auth.mjs
          node scripts/check-website-tag.mjs
          node scripts/check-native-session.mjs
          node scripts/check-chat-ui.mjs
          node scripts/check-drop-item-server.mjs
          npm run check:scroll
          node scripts/check-loot-ui.mjs
          node scripts/check-item-roll-details.mjs
          node scripts/check-item-tooltip-rendering.mjs
          node scripts/check-bank-ui.mjs
          node scripts/check-item-locks.mjs
          npm run check:talent-hover
          node scripts/check-map-guidance.mjs
          node scripts/check-zeppelin-client.mjs
          node scripts/check-zeppelin-ui.mjs
          git diff --exit-code
      - name: Run arena-performance checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'arena-performance') }}
        timeout-minutes: 15
        run: |
          npm run check:colosseum
          npm run check:arena
          npm run check:arena-wagers
          npm run check:performance
          npm run check:graphics
          git diff --exit-code
      - name: Run gm-controls checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'gm-controls') }}
        timeout-minutes: 15
        run: |
          npm run check:gm
          npm run check:loot-trace
          node scripts/check-auto-attacks.mjs
          node scripts/check-auto-attacks-client.mjs
          npm run check:keybindings
          node scripts/check-navigation.mjs
          node scripts/check-targeting.mjs
          node scripts/check-movement-client.mjs
          node scripts/check-jumping.mjs
          npm run check:climbing
          npm run check:collision
          node scripts/check-hotbar.mjs
          node scripts/check-hotbar-server.mjs
          git diff --exit-code
      - name: Run characters-treasury checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'characters-treasury') }}
        timeout-minutes: 15
        run: |
          node scripts/check-localization.mjs --catalog-only
          node scripts/check-character-names.mjs
          node scripts/check-progression.mjs
          node scripts/check-talents.mjs
          node scripts/check-talent-editor.mjs
          node scripts/check-appearance.mjs
          node scripts/check-character-creation.mjs
          node scripts/check-treasury-chain.mjs
          node scripts/check-treasury-server.mjs
          node scripts/check-treasure-ui.mjs
          node scripts/check-treasury-realms.mjs
          git diff --exit-code
      - name: Require patch notes for gameplay changes
        if: ${{ !cancelled() && steps.build.outcome == 'success' && contains(matrix.suites, 'store-release') && (github.event_name == 'pull_request' || github.event_name == 'push') }}
        env:
          MOSSVALE_WIKI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MOSSVALE_WIKI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node wiki/check-sync.mjs "$MOSSVALE_WIKI_BASE" "$MOSSVALE_WIKI_HEAD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: contains(matrix.suites, 'store-release')
        with:
          name: release-manifest
          path: dist/release.json
          if-no-files-found: error
          retention-days: 14

  # Keep the stable required status while refusing failed, cancelled, or skipped shards.
  checks:
    needs: check-shards
    if: always()
    runs-on: [self-hosted, linux, x64, mossvale-ci]
    timeout-minutes: 5
    steps:
      - name: Require every check shard to pass
        env:
          CHECK_RESULT: ${{ needs.check-shards.result }}
        run: test "$CHECK_RESULT" = success

  image:
    needs: activation-preflight
    if: github.repository == 'trappyon/mossvale' && github.ref == 'refs/heads/main' && vars.MOSSVALE_PRODUCTION_ENABLED == 'true'
    runs-on: [self-hosted, linux, x64, mossvale-ci]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: image
        with:
          context: .
          file: deploy/ovh/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/trappyon/mossvale-game:sha-${{ github.sha }}
          build-args: MOSSVALE_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/trappyon/mossvale
          provenance: false
          sbom: false

  deploy:
    needs: [checks, image]
    outputs:
      wiki-ready: ${{ steps.wiki-release.outputs.ready }}
      economy-version: ${{ steps.wiki-release.outputs.economy-version }}
    runs-on: [self-hosted, linux, x64, mossvale-ci]
    timeout-minutes: 120 # Includes image pulls, normal drains, and an optional settings replacement/drain.
    environment: production
    permissions:
      contents: write # Advance only the production branch after the EU final save.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci --omit=dev
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-manifest
          path: dist
      - name: Prepare scoped deployment access
        env:
          US_SSH_KEY: ${{ secrets.MOSSVALE_US_DEPLOY_KEY }}
          US_KNOWN_HOSTS: ${{ secrets.MOSSVALE_US_KNOWN_HOSTS }}
          ASIA_SSH_KEY: ${{ secrets.MOSSVALE_ASIA_DEPLOY_KEY }}
          ASIA_KNOWN_HOSTS: ${{ secrets.MOSSVALE_ASIA_KNOWN_HOSTS }}
        run: |
          umask 077
          test -n "$US_SSH_KEY" && test -n "$US_KNOWN_HOSTS"
          test -n "$ASIA_SSH_KEY" && test -n "$ASIA_KNOWN_HOSTS"
          printf '%s\n' "$US_SSH_KEY" > "$RUNNER_TEMP/mossvale-us-deploy-key"
          printf '%s\n' "$US_KNOWN_HOSTS" > "$RUNNER_TEMP/mossvale-us-known-hosts"
          printf '%s\n' "$ASIA_SSH_KEY" > "$RUNNER_TEMP/mossvale-asia-deploy-key"
          printf '%s\n' "$ASIA_KNOWN_HOSTS" > "$RUNNER_TEMP/mossvale-asia-known-hosts"
      - name: Stage all realms, then drain, deploy, and verify EU, US, and Asia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOSSVALE_DEPLOY_TOKEN: ${{ secrets.MOSSVALE_DEPLOY_TOKEN }}
          MOSSVALE_US_SSH_KEY: ${{ runner.temp }}/mossvale-us-deploy-key
          MOSSVALE_US_KNOWN_HOSTS: ${{ runner.temp }}/mossvale-us-known-hosts
          MOSSVALE_ASIA_SSH_KEY: ${{ runner.temp }}/mossvale-asia-deploy-key
          MOSSVALE_ASIA_KNOWN_HOSTS: ${{ runner.temp }}/mossvale-asia-known-hosts
          RELEASE_IMAGE: ghcr.io/trappyon/mossvale-game@${{ needs.image.outputs.digest }}
          MOSSVALE_ACTIVATE_ARENA: ${{ vars.MOSSVALE_ACTIVATE_ARENA }}
          MOSS_ARENA_CONTRACT: ${{ vars.MOSS_ARENA_CONTRACT }}
          MOSS_ARENA_AUTHORITY_KEY: ${{ secrets.MOSS_ARENA_AUTHORITY_KEY }}
          MOSS_ARENA_RPC_URL: ${{ secrets.MOSS_ARENA_RPC_URL }}
          MOSSVALE_ACTIVATE_APPLE_IAP: ${{ vars.MOSSVALE_ACTIVATE_APPLE_IAP }}
          MOSSVALE_ACTIVATE_TURNKEY: ${{ vars.MOSSVALE_ACTIVATE_TURNKEY }}
          MOSSVALE_ACTIVATE_GOLD_ECONOMY: ${{ inputs.activate_gold_economy && 'true' || vars.MOSSVALE_ACTIVATE_GOLD_ECONOMY }}
          MOSSVALE_EU_BBA_APP_ID: ${{ vars.MOSSVALE_EU_BBA_APP_ID }}
          BBA_API_TOKEN: ${{ secrets.MOSSVALE_BBA_API_TOKEN || secrets.BBA_API_TOKEN }}
          APPLE_IAP_PRIVATE_KEY: ${{ secrets.APPLE_IAP_PRIVATE_KEY }}
          APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID }}
          APPLE_IAP_ISSUER_ID: ${{ secrets.APPLE_IAP_ISSUER_ID }}
          MOBILE_PURCHASE_SANDBOX_ACCOUNTS: ${{ secrets.MOBILE_PURCHASE_SANDBOX_ACCOUNTS }}
          TURNKEY_ORGANIZATION_ID: ${{ vars.TURNKEY_ORGANIZATION_ID }}
          TURNKEY_AUTH_PROXY_CONFIG_ID: ${{ vars.TURNKEY_AUTH_PROXY_CONFIG_ID }}
          ALCHEMY_WALLET_API_KEY: ${{ secrets.ALCHEMY_WALLET_API_KEY }}
          ALCHEMY_GAS_POLICY_ID: ${{ vars.ALCHEMY_GAS_POLICY_ID }}
          TURNKEY_SPONSOR_MAX_OPERATION_WEI: ${{ vars.TURNKEY_SPONSOR_MAX_OPERATION_WEI }}
          TURNKEY_SPONSOR_ACCOUNT_DAILY_WEI: ${{ vars.TURNKEY_SPONSOR_ACCOUNT_DAILY_WEI }}
          TURNKEY_SPONSOR_WALLET_DAILY_WEI: ${{ vars.TURNKEY_SPONSOR_WALLET_DAILY_WEI }}
          TURNKEY_SPONSOR_GLOBAL_DAILY_WEI: ${{ vars.TURNKEY_SPONSOR_GLOBAL_DAILY_WEI }}
          TURNKEY_SPONSOR_MAX_FEE_PER_GAS_WEI: ${{ vars.TURNKEY_SPONSOR_MAX_FEE_PER_GAS_WEI }}
          TURNKEY_SPONSOR_GLOBAL_DAILY_OPERATIONS: ${{ vars.TURNKEY_SPONSOR_GLOBAL_DAILY_OPERATIONS }}
        run: |
          if [ -n "$ALCHEMY_WALLET_API_KEY" ]; then
            node scripts/turnkey-activation-preflight.mjs --chain-only
          fi
          node scripts/rollout.mjs "$RELEASE_IMAGE"
      - name: Confirm completed release for wiki publishing
        id: wiki-release
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/deployment/result.json', 'utf8'));
          if (!report.skipped) {
            assert(report.completedAt && report.revision === process.env.GITHUB_SHA);
            assert(['eu', 'us', 'asia'].every(realm => report[realm]?.revision === process.env.GITHUB_SHA));
            const versions = ['eu', 'us', 'asia'].map(realm => report[realm].economyVersion ?? 0);
            assert(versions.every(version => version === versions[0]) && [0, 1].includes(versions[0]));
            appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
            appendFileSync(process.env.GITHUB_OUTPUT, `economy-version=${versions[0]}\n`);
          }
          NODE
      - name: Remove ephemeral deployment access
        if: always()
        run: rm -f "$RUNNER_TEMP/mossvale-us-deploy-key" "$RUNNER_TEMP/mossvale-us-known-hosts" "$RUNNER_TEMP/mossvale-asia-deploy-key" "$RUNNER_TEMP/mossvale-asia-known-hosts"
      - name: Save public verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-verification
          path: artifacts/deployment/result.json
          if-no-files-found: ignore
          retention-days: 30

  wiki:
    needs: deploy
    if: needs.deploy.outputs.wiki-ready == 'true'
    env:
      MOSSVALE_WIKI_ECONOMY_VERSION: ${{ needs.deploy.outputs.economy-version }}
    runs-on: [self-hosted, linux, x64, mossvale-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:wiki
      - name: Confirm every live realm still runs this revision
        run: node wiki/verify-live.mjs "$GITHUB_SHA" --realms-only
      - name: Publish matching wiki
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MOSSVALE_WIKI_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure GitHub Actions secret MOSSVALE_WIKI_CLOUDFLARE_API_TOKEN to publish the mossvale-wiki Worker. The game release has already completed."
            exit 1
          fi
          # Cloudflare API timeouts are transient; never retry a superseded game revision.
          for attempt in 1 2 3; do
            node wiki/verify-live.mjs "$GITHUB_SHA" --realms-only
            if npx --yes wrangler@4.131.1 deploy --config wiki/wrangler.jsonc; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          exit 1
      - name: Verify public wiki and game revisions
        run: |
          # A new Worker publication can briefly serve files from its previous version.
          for attempt in 1 2 3 4; do
            if node wiki/verify-live.mjs "$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then sleep 10; fi
          done
          exit 1

  stats:
    needs: deploy
    if: needs.deploy.outputs.wiki-ready == 'true'
    runs-on: [self-hosted, linux, x64, mossvale-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:stats
      - name: Confirm every live realm still runs this revision
        run: node wiki/verify-live.mjs "$GITHUB_SHA" --realms-only
      - name: Publish public player statistics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MOSSVALE_STATS_CLOUDFLARE_API_TOKEN || secrets.MOSSVALE_WIKI_CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Configure MOSSVALE_STATS_CLOUDFLARE_API_TOKEN or authorize MOSSVALE_WIKI_CLOUDFLARE_API_TOKEN to publish the mossvale-stats Worker. The game release has already completed."
            exit 1
          fi
          npx --yes wrangler@4.131.1 deploy --config stats/wrangler.jsonc
      - name: Verify public statistics and game revisions
        run: |
          for attempt in 1 2 3 4; do
            if node stats/verify-live.mjs "$GITHUB_SHA"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then sleep 10; fi
          done
          exit 1
