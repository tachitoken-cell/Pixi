<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mossvale quest object review</title><style>body{margin:0;background:#17291d;color:#f5e7b8;font:16px Georgia,serif}header{position:absolute;top:0;left:0;right:0;padding:18px;background:#06291ee8;z-index:1}select{max-width:90vw;background:#183e2a;color:#f5e7b8;font:inherit;padding:8px;border:1px solid #b89a54}small{display:block;margin-top:8px}canvas{display:block}</style></head><body><header><select id="choice" aria-label="Quest object"></select><small id="status">Loading real character and quest prop models…</small></header><script type="module">
import * as THREE from 'three';
import {createStoryWorld} from '/src/story-world.ts';
import {STORY_OBJECTS,STORY_ENCOUNTERS} from '/src/story-world-data.ts';
import {storyQuestById,storyQuestsValid} from '/src/story-quests.ts';
import {loadCharacterAssets} from '/src/characters.ts';
const scene=new THREE.Scene();scene.background=new THREE.Color('#243b2a');scene.add(new THREE.HemisphereLight('#ffffdc','#2b362d',2.2));const sun=new THREE.DirectionalLight('#fff0c2',3);sun.position.set(8,12,6);scene.add(sun);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.05,100);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:'#3d5534',roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
await loadCharacterAssets();const world=await createStoryWorld(scene),observer=new THREE.Vector3();const cases=[...STORY_OBJECTS.map(object=>({id:object.id,object})),...STORY_ENCOUNTERS.map(encounter=>({id:encounter.id,object:STORY_OBJECTS.find(o=>o.id===encounter.objectId),encounter}))];
const select=document.querySelector('#choice');select.innerHTML=cases.map(entry=>`<option value="${entry.id}">${entry.object.name}${entry.encounter?' — encounter':''}</option>`).join('');
function inspect(id){
 const entry=cases.find(entry=>entry.id===id);if(!entry)throw Error('Unknown case '+id);const object=entry.object,quest=storyQuestById(object.questId),completed=new Set();
 function include(id){for(const required of storyQuestById(id).requires??[]){include(required);completed.add(required);}}include(quest.id);
 const targetIndex=quest.objectives.findIndex(o=>o.targets.includes(object.id)||entry.encounter&&o.targets.includes(entry.encounter.id)||STORY_ENCOUNTERS.some(e=>e.objectId===object.id&&o.targets.includes(e.id)));if(targetIndex<0)throw Error('Missing objective for '+id);
 const player={storyQuests:{active:{[quest.id]:quest.objectives.map((o,i)=>i<targetIndex?o.count:0)},completed:[...completed]}};if(!storyQuestsValid(player.storyQuests))throw Error('Invalid review state '+id);
 observer.set(object.x,0,object.z);const encounter=entry.encounter?{id:entry.encounter.id,objectId:object.id,x:object.x,z:object.z,hp:85,phase:entry.encounter.route?'moving':'fighting',wave:1,waves:entry.encounter.waves.length}:null;
 world.update(player,encounter,1,observer);if(encounter?.phase==='moving'){encounter.x+=.15;world.update(player,encounter,1.1,observer);}
 const model=world.models.get(object.id);if(!model.visible)throw Error('Quest object is not visible '+id);for(const [key,group]of world.models)if(key!==object.id)group.visible=false;
 const box=new THREE.Box3().setFromObject(model);if(box.isEmpty())throw Error('Empty quest model '+id);const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());const distance=Math.max(4.5,size.length()*1.7);camera.position.copy(center).add(new THREE.Vector3(.85,.7,1).normalize().multiplyScalar(distance));camera.lookAt(center);ground.position.set(center.x,box.min.y-.015,center.z);sun.position.set(center.x+8,center.y+12,center.z+6);sun.target.position.copy(center);scene.add(sun.target);renderer.render(scene,camera);
 document.querySelector('#status').textContent=`${quest.title} · ${object.kind} · Actual createStoryWorld model on neutral review floor; not a live realm screenshot.`;select.value=id;
 window.review.current={id,kind:object.kind,dimensions:size.toArray(),meshes:0,status:model.userData.storyStatus,questId:quest.id};model.traverse(node=>{if(node.isMesh)window.review.current.meshes++;});return window.review.current;
}
window.review={cases:cases.map(e=>({id:e.id,name:e.object.name,kind:e.object.kind,encounter:!!e.encounter})),inspect};select.onchange=()=>inspect(select.value);inspect(cases[0].id);document.body.dataset.ready='true';
</script></body></html>
