<!doctype html>
<html lang="en">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mossvale · Pets</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#24332c;color:#f6ebce;font:14px/1.5 system-ui,sans-serif}main{display:grid;grid-template-columns:280px 1fr;height:100dvh}aside{padding:24px;background:#293b31;border-right:1px solid #63785b;overflow:auto}h1{font:32px/1.2 Georgia,serif;margin:0 0 20px}p{color:#d3d9c4}label{display:block;margin:18px 0 5px}select,button{font:inherit;color:inherit;background:#3b5040;border:1px solid #8b9f77;border-radius:4px;padding:10px;width:100%;min-height:44px}button{cursor:pointer;margin-top:16px}select:focus-visible,button:focus-visible{outline:2px solid #e6c778;outline-offset:3px}#viewport{min-width:0;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.pet-label{position:absolute;transform:translate(-50%,-50%);font-size:12px;text-shadow:0 1px 4px #132418;background:#24332cc9;padding:2px 7px;white-space:nowrap}#status{position:absolute;bottom:16px;left:16px;right:16px;text-align:center;padding:9px;background:#24332cdd;pointer-events:none}#source{color:#e7cd86}.pet-portrait[hidden]{display:none}.pet-portrait{display:block;width:176px;height:176px;object-fit:contain;margin:12px auto}.preview-note{font-size:12px}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:auto minmax(320px,1fr)}aside{padding:12px 16px;max-height:38dvh;border:0}h1{font-size:25px;margin:0 0 8px}label{margin-top:8px}p{margin:6px 0}.pet-portrait{display:none}button{margin-top:8px}.preview-note{display:none}}
</style>
<main><aside><h1>Rare companions</h1>
<label for="pet">Pet</label><select id="pet"><option value="new">New companions</option><option value="all">All pets, including retired</option></select>
<img id="portrait" class="pet-portrait" src="/ui/pets/moss-fox.png" alt="" hidden>
<p id="description">Loading companions…</p><p id="source"></p>
<label for="animation">Animation</label><select id="animation"><option value="idle">Idle</option><option value="follow">Walk, hop & fly</option></select>
<button id="pause" type="button" aria-pressed="false">Pause animation</button>
<p class="preview-note">Drag to orbit · Scroll to zoom. These are the game’s Blender models and pet animations.</p>
<p class="preview-note">Unlearned drops can be auctioned or learned. Only one learned pet can be summoned at a time in game.</p>
</aside><section id="viewport"><canvas id="preview" tabindex="0" aria-label="Interactive pet model preview"></canvas><div id="labels" aria-hidden="true"></div><div id="status" role="status">Loading pet models…</div></section></main>
<script type="module" src="/src/pet-preview.ts"></script>
</html>
