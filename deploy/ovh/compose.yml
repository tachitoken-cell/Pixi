name: mossvale-${REALM_ID:-us}

services:
  postgres:
    # Retain the original local volume for recovery; it is not the shared game DB.
    profiles: [local-storage]
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: mossvale
      POSTGRES_DB: mossvale_us
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mossvale -d mossvale_us']
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 2m
    logging:
      driver: local

  database-tools:
    profiles: [maintenance]
    image: postgres:17-bookworm
    entrypoint: [sh, /tools/database-tools.sh]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the canonical shared PostgreSQL URL before starting either realm}
      DATABASE_CA_BASE64: ${DATABASE_CA_BASE64:-}
    volumes:
      - ./database-tools.sh:/tools/database-tools.sh:ro
    networks: [default, database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  game:
    build:
      context: ../..
      dockerfile: deploy/ovh/Dockerfile
    image: mossvale-${REALM_ID:-us}:local
    restart: unless-stopped
    init: true
    environment:
      REALM_ID: ${REALM_ID:-us}
      REALM_EU_ORIGIN: ${REALM_EU_ORIGIN:-https://mossvale.world}
      REALM_US_ORIGIN: ${REALM_US_ORIGIN:-https://us.mossvale.world}
      REALM_ASIA_ORIGIN: ${REALM_ASIA_ORIGIN:-}
      GAME_ALLOWED_ORIGINS: ${GAME_ALLOWED_ORIGINS:-https://mossvale.world}
      KEYCLOAK_URL: ${KEYCLOAK_URL:?Set the existing public Keycloak URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?Set the existing Keycloak realm}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?Set the existing public Keycloak client}
      KEYCLOAK_ACCOUNT_ISSUER: ${KEYCLOAK_ACCOUNT_ISSUER:-}
      TURNKEY_ORGANIZATION_ID: ${TURNKEY_ORGANIZATION_ID:-}
      TURNKEY_AUTH_PROXY_CONFIG_ID: ${TURNKEY_AUTH_PROXY_CONFIG_ID:-}
      ALCHEMY_WALLET_API_KEY: ${ALCHEMY_WALLET_API_KEY:-}
      ALCHEMY_GAS_POLICY_ID: ${ALCHEMY_GAS_POLICY_ID:-}
      TURNKEY_SPONSOR_MAX_OPERATION_WEI: ${TURNKEY_SPONSOR_MAX_OPERATION_WEI:-}
      TURNKEY_SPONSOR_ACCOUNT_DAILY_WEI: ${TURNKEY_SPONSOR_ACCOUNT_DAILY_WEI:-}
      TURNKEY_SPONSOR_WALLET_DAILY_WEI: ${TURNKEY_SPONSOR_WALLET_DAILY_WEI:-}
      TURNKEY_SPONSOR_GLOBAL_DAILY_WEI: ${TURNKEY_SPONSOR_GLOBAL_DAILY_WEI:-}
      TURNKEY_SPONSOR_MAX_FEE_PER_GAS_WEI: ${TURNKEY_SPONSOR_MAX_FEE_PER_GAS_WEI:-}
      TURNKEY_SPONSOR_GLOBAL_DAILY_OPERATIONS: ${TURNKEY_SPONSOR_GLOBAL_DAILY_OPERATIONS:-}
      # Leave unconfigured integrations disabled; secrets are runtime-only.
      KEYCLOAK_SOCIAL_PROVIDERS: ${KEYCLOAK_SOCIAL_PROVIDERS:-}
      KEYCLOAK_DELETE_CLIENT_ID: ${KEYCLOAK_DELETE_CLIENT_ID:-}
      KEYCLOAK_DELETE_CLIENT_SECRET: ${KEYCLOAK_DELETE_CLIENT_SECRET:-}
      KEYCLOAK_DELETE_CLIENT_REALM: ${KEYCLOAK_DELETE_CLIENT_REALM:-}
      APPLE_IAP_PRIVATE_KEY: ${APPLE_IAP_PRIVATE_KEY:-}
      APPLE_IAP_KEY_ID: ${APPLE_IAP_KEY_ID:-}
      APPLE_IAP_ISSUER_ID: ${APPLE_IAP_ISSUER_ID:-}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_RTDN_AUDIENCE: ${GOOGLE_RTDN_AUDIENCE:-}
      GOOGLE_RTDN_EMAIL: ${GOOGLE_RTDN_EMAIL:-}
      GOOGLE_RTDN_SUBSCRIPTION: ${GOOGLE_RTDN_SUBSCRIPTION:-}
      MOBILE_PURCHASE_SANDBOX_ACCOUNTS: ${MOBILE_PURCHASE_SANDBOX_ACCOUNTS:-}
      DATABASE_URL: ${DATABASE_URL:?Set the canonical shared PostgreSQL URL before starting either realm}
      DATABASE_CA_BASE64: ${DATABASE_CA_BASE64:-}
      AUCTION_CONTRACT: ${AUCTION_CONTRACT:-}
      AUCTION_AUTHORITY_KEY: ${AUCTION_AUTHORITY_KEY:-}
      AUCTION_RPC_URL: ${AUCTION_RPC_URL:-}
      AUCTION_CHAIN_ID: ${AUCTION_CHAIN_ID:-}
      MOSS_AUCTION_CONTRACT: ${MOSS_AUCTION_CONTRACT:-}
      MOSS_AUCTION_AUTHORITY_KEY: ${MOSS_AUCTION_AUTHORITY_KEY:-}
      MOSS_AUCTION_RPC_URL: ${MOSS_AUCTION_RPC_URL:-}
      MOSS_AUCTION_CHAIN_ID: ${MOSS_AUCTION_CHAIN_ID:-}
      MOSS_ARENA_CONTRACT: ${MOSS_ARENA_CONTRACT:-}
      MOSS_ARENA_AUTHORITY_KEY: ${MOSS_ARENA_AUTHORITY_KEY:-}
      MOSS_ARENA_RPC_URL: ${MOSS_ARENA_RPC_URL:-}
      STORE_CONTRACT: ${STORE_CONTRACT:-}
      STORE_LEGACY_CONTRACT: ${STORE_LEGACY_CONTRACT:-}
      STORE_AUTHORITY_KEY: ${STORE_AUTHORITY_KEY:-}
      STORE_RPC_URL: ${STORE_RPC_URL:-}
      TREASURE_TREASURY_CONTRACT: ${TREASURE_TREASURY_CONTRACT:-}
      TREASURE_LEGACY_CONTRACT: ${TREASURE_LEGACY_CONTRACT:-}
      TREASURE_AUTHORITY_KEY: ${TREASURE_AUTHORITY_KEY:-}
      TREASURE_RPC_URL: ${TREASURE_RPC_URL:-}
      NFT_PETS_CONTRACT: ${NFT_PETS_CONTRACT:-}
      NFT_HOUSES_CONTRACT: ${NFT_HOUSES_CONTRACT:-}
      NFT_FEE_RECEIVER: ${NFT_FEE_RECEIVER:-}
      NFT_AUTHORITY_KEY: ${NFT_AUTHORITY_KEY:-}
      NFT_RPC_URL: ${NFT_RPC_URL:-}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY:-}
      CHAT_TRANSLATION_DAILY_CHARACTERS: ${CHAT_TRANSLATION_DAILY_CHARACTERS:-5000}
    networks: [default, database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 2m
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:2567/api/health', {signal: AbortSignal.timeout(4000)}).then(async r => {if (!r.ok || !(await r.json()).ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    logging:
      driver: local

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      US_HOST: ${REALM_HOST:-${US_HOST:-us.mossvale.world}}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../public/realm-restarting.html:/srv/mossvale/realm-restarting.html:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      game:
        condition: service_healthy
    logging:
      driver: local

networks:
  database:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
